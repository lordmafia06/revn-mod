
name: Build REVN Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build REVN
        working-directory: ./revn
        run: gradle build --no-daemon

      - name: Upload REVN JAR
        uses: actions/upload-artifact@v4
        with:
          name: REVN-JAR
          path: revn/build/libs/*.jar
          if-no-files-found: error
